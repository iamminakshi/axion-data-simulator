apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-data-simulator
  namespace: default
  labels:
    app.kubernetes.io/name: data-simulator
    app.kubernetes.io/part-of: axion-infra
    app.kubernetes.io/component: simulator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-simulator
  template:
    metadata:
      labels:
        app: data-simulator
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: simulator-service-account
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - data-simulator
                topologyKey: "kubernetes.io/hostname"

      containers:
        - name: simulator
          image: myregistry.azurecr.io/axion/data-simulator:v1.0.0
          imagePullPolicy: IfNotPresent
          
          env:
            - name: SIMULATOR_RATE_PER_SEC
              value: "100"
            - name: TARGET_ENDPOINT
              value: "http://axion-ingestion-service:8080/api/v1/ingest"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL