apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-simulator
  namespace: default

spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-simulator
  template:
    metadata:
      labels:
        app: data-simulator

    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: simulator
          image: ghcr.io/asign796/axion-data-simulator:9f7de04
          env:
            - name: API_URL
              value: "http://ingestion-service:8000/api/v1/telemetry/ingest"
            - name: INTERVAL_SECONDS
              value: "5"
          ports:
            - containerPort: 8080